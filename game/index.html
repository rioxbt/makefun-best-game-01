<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternkeeper</title>
<meta name="description" content="Lanternkeeper: hold the last light on the abyss shelf through twelve waves of the dark.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lanternkeeper: swing the shield around the lantern with the mouse or A and D to turn away the shades, and let the plankton motes in to feed the light"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
